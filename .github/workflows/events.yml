name: Weekly US Events

on:
  schedule:
    # 23:00 UTC Sunday = 07:00 Monday Singapore, same slot as the earnings
    # digest. Each has its own concurrency group and its own state file, so
    # they do not collide. Kick.gs also starts this job at that time, because
    # GitHub runs this cron two to three and a half hours late. The two later
    # times are backups in case both fail. events.py sends the digest once
    # per week however many times it runs.
    - cron: "0 23 * * 0"
    - cron: "0 1 * * 1"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Send it again even if this week's digest already went out"
        type: boolean
        default: false

concurrency:
  group: us-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  events:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send US events digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python events.py ${{ inputs.force && '--force' || '' }}
      - name: Commit state
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "filings-monitor"
          git config user.email "actions@github.com"
          git add state || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "events digest $(date -u '+%Y-%m-%d')" || exit 0
          # Same retry as the other workflows. The "already sent this week"
          # mark lives in this commit, so it matters that it lands.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BRANCH" \
              && git push origin HEAD:"$BRANCH" && exit 0
            sleep $((i * 5))
          done
          echo "::warning::state push deferred to next run"
          exit 0
